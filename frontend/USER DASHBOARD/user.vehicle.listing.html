<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTO DEALER — Vehicles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="userdashboard.css" rel="stylesheet" />
    <style>
      /* ── SEARCH BAR ── */
      .search-section {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 24px;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        animation: fadeUp 0.35s ease both;
      }
      .search-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .search-title svg {
        width: 16px;
        height: 16px;
        stroke: var(--orange);
      }
      .search-row {
        display: grid;
        grid-template-columns: 1fr 180px 180px 180px auto;
        gap: 10px;
        align-items: end;
      }
      .search-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .search-field label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .search-input {
        height: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0 12px;
        font-family: "DM Sans", sans-serif;
        font-size: 13.5px;
        color: var(--text);
        background: var(--bg);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .search-input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 92, 26, 0.1);
      }
      .search-btn {
        background: var(--orange);
        height: 40px;
        padding: 0 20px;
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-family: "DM Sans", sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .search-btn svg {
        width: 15px;
        height: 15px;
      }
      .clear-btn {
        height: 40px;
        padding: 0 14px;
        background: none;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .clear-btn:hover {
        border-color: var(--orange);
        color: var(--orange);
      }
      .results-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .results-count {
        font-size: 13px;
        color: var(--muted);
      }
      .results-count strong {
        color: var(--dark);
        font-weight: 600;
      }
      .sort-select {
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0 10px;
        font-family: "DM Sans", sans-serif;
        font-size: 12.5px;
        color: var(--text);
        background: var(--white);
        outline: none;
        cursor: pointer;
      }
      .active-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        background: var(--orange-dim);
        border: 1px solid rgba(255, 92, 26, 0.25);
        border-radius: 99px;
        font-size: 12px;
        color: var(--orange);
        font-weight: 500;
      }
      .vehicles-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 28px;
      }
      .vehicle-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition:
          transform 0.22s,
          box-shadow 0.22s,
          border-color 0.22s;
        animation: fadeUp 0.4s ease both;
      }
      .vehicle-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
        border-color: rgba(255, 92, 26, 0.3);
      }
      .vehicle-img-wrap {
        position: relative;
        height: 170px;
        background: var(--bg);
        overflow: hidden;
      }
      .vehicle-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .vehicle-card:hover .vehicle-img-wrap img {
        transform: scale(1.04);
      }
      .vehicle-img-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 56px;
        background: linear-gradient(135deg, #f4f5f7, #e9eaec);
      }
      .avail-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 700;
      }
      .avail-badge.available {
        background: #ecfdf5;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }
      .avail-badge.booked {
        background: #fff1f2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }
      .vehicle-card-body {
        padding: 16px;
      }
      .vc-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 8px;
      }
      .vc-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .vc-meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 11px;
        color: var(--text);
        font-weight: 500;
      }
      .vc-prices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 14px;
      }
      .price-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 6px;
        text-align: center;
      }
      .price-box-dur {
        display: block;
        font-size: 9px;
        font-family: "Space Mono", monospace;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 3px;
      }
      .price-box-val {
        display: block;
        font-family: "Bebas Neue", sans-serif;
        font-size: 17px;
        color: var(--dark);
        letter-spacing: 0.5px;
        line-height: 1;
      }
      .view-btn {
        display: block;
        width: 100%;
        padding: 10px;
        background: var(--orange);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-family: "DM Sans", sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition:
          background 0.2s,
          transform 0.15s;
      }
      .view-btn:hover {
        transform: translateY(-1px);
      }
      .empty-state {
        grid-column: 1/-1;
        text-align: center;
        padding: 64px 24px;
        color: var(--muted);
      }
      .empty-state h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 6px;
      }
      .empty-state p {
        font-size: 13px;
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 28px;
      }
      .page-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--white);
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .page-btn:hover {
        border-color: var(--orange);
        color: var(--orange);
      }
      .page-btn.active {
        background: var(--orange);
        color: #fff;
        border-color: var(--orange);
      }
      .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      @media (max-width: 1100px) {
        .vehicles-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        .vehicles-grid {
          grid-template-columns: 1fr;
        }
        .search-row {
          grid-template-columns: 1fr;
        }
      }

      /* ══ USER DROPDOWN ══ */
      .user-dropdown-wrap {
        position: relative;
        cursor: pointer;
      }
      .topbar-chevron {
        transition: transform 0.2s;
        color: #9ca3af;
        flex-shrink: 0;
      }
      .topbar-chevron.open {
        transform: rotate(180deg);
      }
      .user-dropdown-menu {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 210px;
        background: #fff;
        border: 0.5px solid #e5e7eb;
        border-radius: 12px;
        padding: 6px;
        z-index: 999;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .user-dropdown-menu.open {
        display: block;
      }
      .dd-header {
        padding: 10px 10px 8px;
        border-bottom: 0.5px solid #f0f0f0;
        margin-bottom: 4px;
      }
      .dd-header-name {
        font-size: 13px;
        font-weight: 600;
        color: #111;
      }
      .dd-header-email {
        font-size: 11px;
        color: #9ca3af;
      }
      .dd-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border: none;
        background: none;
        border-radius: 8px;
        font-size: 13px;
        color: #111;
        cursor: pointer;
        text-align: left;
      }
      .dd-item:hover {
        background: #f9fafb;
      }
      .dd-item svg {
        color: #6b7280;
        flex-shrink: 0;
      }
      .dd-kyc-badge {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 99px;
        background: #fff8e1;
        color: #b45309;
        font-weight: 500;
      }
      .dd-divider {
        height: 0.5px;
        background: #f0f0f0;
        margin: 4px 0;
      }
      .dd-danger {
        color: #dc2626;
      }
      .dd-danger svg {
        color: #dc2626;
      }
      .dd-danger:hover {
        background: #fef2f2;
      }
    </style>
  </head>

    <div class="main-wrap">

        </button>
        <span class="topbar-page-title">Vehicles</span>
        <div class="topbar-right">
          <button class="icon-btn" id="notifBtn" title="Notifications">

              viewBox="0 0 24 24"

            >

              id="topbarChevron"

            >

          <!-- END USER DROPDOWN -->

      </header>

      <main class="content">
        <!-- Search Section -->
        <div class="search-section">
          <div class="search-title">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Search &amp; Filter Vehicles
          </div>
          <div class="search-row">
            <div class="search-field">
              <label>Search by name or keyword</label>
              <input
                class="search-input"
                type="text"
                id="searchText"
                placeholder="e.g. Fortuner, SUV, Toyota…"
                oninput="applyFilters()"
              />
            </div>
            <div class="search-field">
              <label>Body Type</label>
              <select
                class="search-input"
                id="filterBody"
                onchange="applyFilters()"
              >
                <option value="">All Body Types</option>
                <option>SUV</option>
                <option>Sedan</option>
                <option>Hatchback</option>
                <option>MPV</option>
                <option>Off-Road</option>
                <option>Pickup</option>
              </select>
            </div>
            <div class="search-field">
              <label>Fuel Type</label>
              <select
                class="search-input"
                id="filterFuel"
                onchange="applyFilters()"
              >
                <option value="">All Fuel Types</option>
                <option>Petrol</option>
                <option>Diesel</option>
                <option>Electric</option>
                <option>Hybrid</option>
                <option>CNG</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px">
              <button class="search-btn" onclick="applyFilters()">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Search
              </button>
              <button class="clear-btn" onclick="clearFilters()">Clear</button>
            </div>
          </div>
        </div>

        <div class="active-filters" id="activeFilters"></div>

        <div class="results-meta">
          <p class="results-count">
            Showing <strong id="resultCount">0</strong> vehicles
          </p>
          <select class="sort-select" id="sortSelect" onchange="applyFilters()">
            <option value="default">Sort: Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>

        <div class="vehicles-grid" id="vehicleGrid"></div>
        <div class="pagination" id="pagination"></div>

        <div class="footer-strip">
          <p>© 2026 Auto Dealer Fleet Management. All rights reserved.</p>
          <div class="footer-links">
            <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a>
          </div>
        </div>
      </main>
    </div>

    <script>
      /* ── STATE ── */
      let VEHICLES = [];
      let filtered = [];

      /* ── USER DROPDOWN ── */
      const userDropdownWrap = document.getElementById("userDropdownWrap");
      const userDropdownMenu = document.getElementById("userDropdownMenu");
      const topbarChevron = document.getElementById("topbarChevron");

      userDropdownWrap?.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = userDropdownMenu.classList.toggle("open");
        topbarChevron.classList.toggle("open", open);
      });
      document.addEventListener("click", () => {
        userDropdownMenu?.classList.remove("open");
        topbarChevron?.classList.remove("open");
      });
      document.getElementById("logoutBtn")?.addEventListener("click", () => {
        window.location.href = "/index.html";
      });

      /* ── MOBILE SIDEBAR ── */
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const toggle = document.getElementById("sidebarToggle");
      toggle?.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("open");
      });
      overlay?.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("open");
      });
      window.addEventListener("resize", () => {
        if (toggle)
          toggle.style.display = window.innerWidth <= 768 ? "flex" : "none";
      });
      if (toggle)
        toggle.style.display = window.innerWidth <= 768 ? "flex" : "none";

      /* ── API FETCH ── */
      async function apiFetch(url, options = {}) {
        try {
          const res = await fetch(url, {
            ...options,
            headers: {
              "Content-Type": "application/json",
              ...(options.headers || {}),
            },
          });
          if (!res.ok) throw new Error("API error: " + res.status);
          return await res.json();
        } catch (err) {
          console.error("Fetch error:", err);
          return null;
        }
      }

      /* ── LOAD VEHICLES ── */
      async function loadVehicles() {
        const json = await apiFetch("/api/user/vehicles");
        VEHICLES = Array.isArray(json) ? json : json?.data || [];
        filtered = [...VEHICLES];
        renderGrid();
      }

      /* ── LOAD USER PROFILE ── */
      async function loadUserProfile() {
        const user = await apiFetch("/api/user/profile");
        if (!user) return;

        const fullName =
          `${user.first_name || ""} ${user.last_name || ""}`.trim() || "User";
        const initials = fullName
          .split(" ")
          .map((n) => n[0])
          .join("")
          .toUpperCase();
        const kycStatus = (user.kyc_status || "not_submitted").toLowerCase();
        const isVerified = kycStatus === "verified";

        /* topbar */
        const setTxt = (id, v) => {
          const el = document.getElementById(id);
          if (el) el.textContent = v;
        };
        setTxt("topbarName", fullName);
        setTxt("topbarInitials", initials);
        setTxt("topbarRole", isVerified ? "✔ Verified Member" : "Member");
        setTxt("ddName", fullName);
        setTxt("ddEmail", user.email || "");

        /* sidebar */
        setTxt("sidebarName", fullName);
        setTxt("sidebarInitials", initials);

        /* KYC badge in dropdown */
        const kycBadge = document.getElementById("ddKycBadge");
        if (kycBadge) {
          if (isVerified) {
            kycBadge.textContent = "Verified";
            kycBadge.style.background = "#ecfdf5";
            kycBadge.style.color = "#16a34a";
          } else if (kycStatus === "rejected") {
            kycBadge.textContent = "Rejected";
            kycBadge.style.background = "#fff1f2";
            kycBadge.style.color = "#dc2626";
          } else {
            kycBadge.textContent = "Pending";
          }
        }

        /* sidebar KYC */
        const sidebarKyc = document.getElementById("sidebarKyc");
        if (sidebarKyc) {
          if (isVerified) {
            sidebarKyc.textContent = "✔ KYC Verified";
            sidebarKyc.className = "user-kyc-status verified";
          } else if (kycStatus === "rejected") {
            sidebarKyc.textContent = "✖ KYC Rejected";
            sidebarKyc.className = "user-kyc-status unverified";
          } else if (kycStatus === "pending") {
            sidebarKyc.textContent = "⏳ KYC Pending";
            sidebarKyc.className = "user-kyc-status unverified";
          } else {
            sidebarKyc.textContent = "⚠ KYC Not Submitted";
            sidebarKyc.className = "user-kyc-status unverified";
          }
        }

        /* topbar role color */
        const roleEl = document.getElementById("topbarRole");
        if (roleEl && isVerified) roleEl.style.color = "#16a34a";
      }

      /* ── RENDER GRID ── */
      function renderGrid() {
        const sort = document.getElementById("sortSelect").value;
        let data = [...filtered];
        if (sort === "price-asc")
          data.sort((a, b) => (a.price_4h || 0) - (b.price_4h || 0));
        if (sort === "price-desc")
          data.sort((a, b) => (b.price_4h || 0) - (a.price_4h || 0));
        if (sort === "name-asc")
          data.sort((a, b) => (a.name || "").localeCompare(b.name || ""));

        const grid = document.getElementById("vehicleGrid");
        const countEl = document.getElementById("resultCount");
        if (countEl) countEl.textContent = data.length;

        if (!data.length) {
          grid.innerHTML = `<div class="empty-state"><h3>No vehicles found</h3><p>Try adjusting filters</p></div>`;
          return;
        }
        grid.innerHTML = data
          .map((v, i) => {
            const img = v.thumbnail ? `/uploads/vehicles/${v.thumbnail}` : "";
            const isAvail = v.status === "Available";
            return `
          <div class="vehicle-card" style="animation-delay:${i * 0.05}s">
            <div class="vehicle-img-wrap">
              ${img ? `<img src="${img}" alt="${v.name || "vehicle"}">` : `<div class="vehicle-img-placeholder">🚗</div>`}
              <span class="avail-badge ${isAvail ? "available" : "booked"}">${isAvail ? "Available" : "Booked"}</span>
            </div>
            <div class="vehicle-card-body">
              <div class="vc-name">${v.name || "Unknown"}</div>
              <div class="vc-meta">
                <span class="vc-meta-pill">⛽ ${v.fuel_type || "-"}</span>
                <span class="vc-meta-pill">🚘 ${v.body_type || "-"}</span>
                <span class="vc-meta-pill">⚙ ${v.transmission || "-"}</span>
              </div>
              <div class="vc-prices">
                <div class="price-box"><span class="price-box-dur">4h</span><span class="price-box-val">${(v.price_4h || 0).toLocaleString()}</span></div>
                <div class="price-box"><span class="price-box-dur">8h</span><span class="price-box-val">${(v.price_8h || 0).toLocaleString()}</span></div>
                <div class="price-box"><span class="price-box-dur">1d</span><span class="price-box-val">${(v.price_1d || 0).toLocaleString()}</span></div>
              </div>
              <a href="vehicle-details.html?id=${v.id}" class="view-btn">View Details →</a>
            </div>
          </div>`;
          })
          .join("");
      }

      /* ── FILTERS ── */
      function applyFilters() {
        const text = document.getElementById("searchText").value.toLowerCase();
        const body = document.getElementById("filterBody").value;
        const fuel = document.getElementById("filterFuel").value;
        filtered = VEHICLES.filter((v) => {
          const matchText =
            !text ||
            (v.name || "").toLowerCase().includes(text) ||
            (v.brand || "").toLowerCase().includes(text) ||
            (v.model || "").toLowerCase().includes(text);
          const matchBody = !body || v.body_type === body;
          const matchFuel = !fuel || v.fuel_type === fuel;
          return matchText && matchBody && matchFuel;
        });
        renderGrid();
      }
      function clearFilters() {
        document.getElementById("searchText").value = "";
        document.getElementById("filterBody").value = "";
        document.getElementById("filterFuel").value = "";
        filtered = [...VEHICLES];
        renderGrid();
      }

      /* ── INIT ── */
      Promise.all([loadVehicles(), loadUserProfile()]);
    </script>
  </body>
</html>
