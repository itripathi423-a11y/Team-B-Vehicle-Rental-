<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTO DEALER — Payment Successful</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #ff5c1a;
        --khalti: #5c2d91;
        --bg: #f4f5f7;
        --white: #fff;
        --dark: #111827;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: var(--white);
        border-radius: 20px;
        padding: 52px 44px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .check-circle {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: #ecfdf5;
        border: 3px solid #bbf7d0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 44px;
      }
      h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 40px;
        letter-spacing: 2px;
        color: var(--dark);
        margin-bottom: 8px;
      }
      h1 span {
        color: var(--khalti);
      }
      .subtitle {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.7;
        margin-bottom: 28px;
      }
      .ref-box {
        background: #f5f0ff;
        border: 1px solid #ddd6fe;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 8px;
      }
      .ref-label {
        font-size: 10px;
        font-family: "Space Mono", monospace;
        letter-spacing: 1.2px;
        color: #7c3aed;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .ref-value {
        font-family: "Space Mono", monospace;
        font-size: 15px;
        font-weight: 700;
        color: var(--khalti);
        letter-spacing: 2px;
      }
      .txn-value {
        font-size: 11px;
        color: var(--muted);
        font-family: "Space Mono", monospace;
        margin-top: 4px;
      }
      .amount-badge {
        display: inline-block;
        background: linear-gradient(135deg, #5c2d91, #7c3db8);
        color: #fff;
        padding: 10px 28px;
        border-radius: 99px;
        font-family: "Bebas Neue", sans-serif;
        font-size: 28px;
        letter-spacing: 1px;
        margin: 16px 0 24px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 24px 0;
      }
      .btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px;
        background: var(--orange);
        border: none;
        border-radius: 11px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .btn-primary:hover {
        background: #e04a0e;
        transform: translateY(-2px);
      }
      .btn-secondary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px;
        background: none;
        border: 1.5px solid var(--border);
        border-radius: 11px;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn-secondary:hover {
        background: var(--bg);
      }
      .security-note {
        margin-top: 20px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check-circle">✅</div>
      <h1>Payment <span>Successful!</span></h1>
      <p class="subtitle">
        Your Khalti payment has been verified and your<br />
        vehicle booking is now confirmed and active.
      </p>

      <div class="ref-box">
        <div class="ref-label">Booking Reference</div>
        <div class="ref-value" id="refVal">—</div>
        <div class="txn-value" id="txnVal"></div>
      </div>

      <div class="amount-badge">Rs <span id="amtVal">—</span></div>

      <div class="divider"></div>

      <div class="btns">
        <a href="mybooking.html" class="btn-primary">📋 View My Booking</a>
        <a href="userdashboard.html" class="btn-secondary"
          >🏠 Go to Dashboard</a
        >
      </div>

      <div class="security-note">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#22c55e"
          stroke-width="2.5"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        Payment secured by Khalti · Regulated by Nepal Rastra Bank
      </div>
    </div>

    <script>
      const p = new URLSearchParams(location.search);
      const ref = p.get("ref") || "—";
      const txn = p.get("txn") || "";
      const amt = p.get("amount") || "—";

      document.getElementById("refVal").textContent = ref;
      document.getElementById("txnVal").textContent = txn ? "TXN: " + txn : "";
      document.getElementById("amtVal").textContent =
        amt !== "—" ? parseFloat(amt).toLocaleString() : "—";
      document.title = `AUTO DEALER — Payment Confirmed · ${ref}`;
    </script>
  </body>
</html>
