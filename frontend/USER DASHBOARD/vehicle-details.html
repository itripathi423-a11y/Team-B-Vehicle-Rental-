<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUTO DEALER — Vehicle Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="userdashboard.css" rel="stylesheet"/>
<style>
.breadcrumb { display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:22px; }
.breadcrumb a { color:var(--muted);text-decoration:none;transition:color .2s; }
.breadcrumb a:hover { color:var(--orange); }
.breadcrumb span { color:var(--dark);font-weight:500; }
.breadcrumb svg { width:12px;height:12px; }
.detail-layout { display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start; }
.detail-main-img { width:100%;height:320px;background:linear-gradient(135deg,#f4f5f7,#e9eaec);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:100px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px;position:relative; }
.avail-overlay { position:absolute;top:16px;left:16px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700; }
.avail-overlay.av { background:#ecfdf5;color:#16a34a;border:1px solid #bbf7d0; }
.avail-overlay.bk { background:#fff1f2;color:#dc2626;border:1px solid #fecaca; }
.gallery { display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap; }
.gallery-thumb { width:72px;height:54px;border-radius:8px;background:var(--bg);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s;overflow:hidden; }
.gallery-thumb:hover,.gallery-thumb.active { border-color:var(--orange); }
.detail-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:18px; }
.detail-card-title { font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px; }
.detail-card-title::before { content:'';display:block;width:3px;height:14px;background:var(--orange);border-radius:2px; }
.specs-grid { display:grid;grid-template-columns:1fr 1fr;gap:0; }
.spec-row { padding:12px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px; }
.specs-grid .spec-row:nth-last-child(1),.specs-grid .spec-row:nth-last-child(2) { border-bottom:none; }
.spec-key { font-size:10.5px;font-family:"Space Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.5px; }
.spec-val { font-size:14px;font-weight:600;color:var(--dark);display:flex;align-items:center;gap:5px; }
.fuel-petrol{color:#ea580c;}.fuel-diesel{color:#1d4ed8;}.fuel-electric{color:#16a34a;}.fuel-hybrid{color:#7c3aed;}.fuel-cng{color:#0891b2;}
.desc-text { font-size:13.5px;line-height:1.7;color:var(--text); }
.detail-sidebar { position:sticky;top:80px;display:flex;flex-direction:column;gap:16px; }
.price-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow); }
.price-card-name { font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:1px;color:var(--dark);line-height:1;margin-bottom:4px; }
.price-card-sub { font-size:12.5px;color:var(--muted);margin-bottom:18px; }
.pricing-options { display:flex;flex-direction:column;gap:8px;margin-bottom:18px; }
.pricing-opt { display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s; }
.pricing-opt:hover,.pricing-opt.selected { border-color:var(--orange);background:rgba(255,92,26,.04); }
.pricing-opt-label { font-size:13.5px;font-weight:500;color:var(--dark);display:flex;align-items:center;gap:8px; }
.pricing-opt-label svg { width:14px;height:14px;stroke:var(--muted); }
.pricing-opt-price { font-family:"Bebas Neue",sans-serif;font-size:20px;color:var(--orange);letter-spacing:.5px; }
.book-now-btn { display:flex;width:100%;padding:13px;background:var(--dark);color:#fff;border:none;border-radius:var(--radius-sm);font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s,transform .15s;align-items:center;justify-content:center;gap:8px; }
.book-now-btn:hover { background:var(--orange);transform:translateY(-1px); }
.info-box { background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:#92400e;display:flex;gap:8px;align-items:flex-start; }
.info-box svg { width:14px;height:14px;stroke:#d97706;flex-shrink:0;margin-top:1px; }
@media(max-width:900px){.detail-layout{grid-template-columns:1fr;}.detail-sidebar{position:static;}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <a href="userdashboard.html" class="sidebar-logo">
    <div class="logo-mark">AD</div>
    <div class="logo-text-block"><span class="logo-brand">Auto Dealer</span><span class="logo-sub">Fleet Management</span></div>
  </a>
  <nav class="sidebar-nav">
    <a href="userdashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="user.vehicle.listing.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v5a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17h8M3 9h18"/></svg>Vehicles</a>
    <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>My Bookings</a>
    <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>KYC</a>
    <a href="#" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Payments</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar">SR</div>
      <div class="user-info"><span class="user-name">Swikar Regmi</span><span class="user-kyc-status unverified">⚠ KYC Pending</span></div>
    </div>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrap">
  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="topbar-page-title" id="pageTitle">Vehicle Details</span>
    <div class="topbar-right">
      <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-badge">3</span></button>
      <div class="topbar-user" id="userMenuTrigger">
        <div class="topbar-avatar">SR</div>
        <div><p class="topbar-name">Swikar Regmi</p><p class="topbar-role">Member</p></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#9ca3af;margin-left:2px;transition:transform .2s" id="dropChevron"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="user-dropdown" id="userDropdown">
        <div class="dropdown-header"><div class="dropdown-name">Swikar Regmi</div><div class="dropdown-email">swikar.regmi@email.com</div></div>
        <div class="dropdown-body">
          <button class="dropdown-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout" onclick="alert('Logging out…')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log Out</button>
        </div>
      </div>
    </div>
  </header>
  <main class="content" id="mainContent">
    <div style="text-align:center;padding:60px;color:var(--muted)">Loading…</div>
  </main>
</div>

<script>
const VEHICLES = [
  {id:1,name:"Toyota Fortuner",brand:"Toyota",model:"Fortuner",year:2023,plate:"BA 1 JA 1234",type:"SUV",fuel:"Diesel",transmission:"Automatic",seats:7,color:"Pearl White",emoji:"🚙",available:true,price4h:3200,price8h:5500,price1d:9500,desc:"A powerful full-size SUV with advanced 4WD system, perfect for city commutes and mountain adventures. Features commanding presence, luxury interiors, and top-tier safety systems."},
  {id:2,name:"Hyundai Creta",brand:"Hyundai",model:"Creta",year:2023,plate:"BA 2 CHA 5678",type:"SUV",fuel:"Petrol",transmission:"Automatic",seats:5,color:"Fiery Red",emoji:"🚗",available:true,price4h:1800,price8h:3000,price1d:5200,desc:"A compact SUV with a sporty design, great fuel efficiency and a premium cabin experience. Ideal for city driving with excellent road presence."},
  {id:3,name:"Suzuki Swift",brand:"Suzuki",model:"Swift",year:2022,plate:"BA 3 NA 9012",type:"Hatchback",fuel:"Petrol",transmission:"Manual",seats:5,color:"Speedy Blue",emoji:"🏎",available:true,price4h:1000,price8h:1800,price1d:3200,desc:"A nimble and fun hatchback perfect for city driving. Great fuel economy and easy to park in tight urban spaces."},
  {id:4,name:"Mahindra Thar",brand:"Mahindra",model:"Thar",year:2022,plate:"BA 4 PA 3456",type:"Off-Road",fuel:"Diesel",transmission:"Manual",seats:4,color:"Rocky Beige",emoji:"🛻",available:false,price4h:2500,price8h:4200,price1d:7500,desc:"An iconic off-road beast built for extreme terrain. The go-to choice for adventurers seeking rugged capability."},
  {id:5,name:"Honda City",brand:"Honda",model:"City",year:2023,plate:"BA 5 KA 7890",type:"Sedan",fuel:"Petrol",transmission:"Automatic",seats:5,color:"Lunar Silver",emoji:"🚘",available:true,price4h:1400,price8h:2600,price1d:4500,desc:"An elegant sedan with class-leading interior space, smooth ride quality, and advanced tech features."},
  {id:6,name:"Toyota Land Cruiser",brand:"Toyota",model:"Land Cruiser",year:2024,plate:"BA 1 BA 2024",type:"SUV",fuel:"Diesel",transmission:"Automatic",seats:8,color:"Midnight Black",emoji:"🚐",available:true,price4h:4500,price8h:7800,price1d:13500,desc:"The pinnacle of luxury SUVs. Unmatched comfort, capability, and prestige for the most demanding journeys."},
  {id:7,name:"Maruti Ertiga",brand:"Maruti",model:"Ertiga",year:2022,plate:"BA 7 DA 1357",type:"MPV",fuel:"CNG",transmission:"Manual",seats:7,color:"Premium Silver",emoji:"🚌",available:true,price4h:1200,price8h:2200,price1d:3800,desc:"A practical 7-seater MPV ideal for family trips. Economical CNG option for budget-conscious travelers."},
  {id:8,name:"Kia Seltos",brand:"Kia",model:"Seltos",year:2023,plate:"BA 8 GA 2468",type:"SUV",fuel:"Petrol",transmission:"Automatic",seats:5,color:"Gravity Grey",emoji:"🚗",available:true,price4h:2000,price8h:3500,price1d:6000,desc:"A feature-packed compact SUV with bold design, excellent tech features and sporty performance."},
  {id:9,name:"Nissan Magnite",brand:"Nissan",model:"Magnite",year:2023,plate:"BA 9 HA 1122",type:"SUV",fuel:"Petrol",transmission:"Automatic",seats:5,color:"Vivid Blue",emoji:"🚗",available:true,price4h:1600,price8h:2900,price1d:5000,desc:"A modern sub-compact SUV loaded with features and great value with an impressive tech suite."},
  {id:10,name:"MG Hector",brand:"MG",model:"Hector",year:2023,plate:"BA 10 IA 3344",type:"SUV",fuel:"Hybrid",transmission:"Automatic",seats:5,color:"Candy White",emoji:"🚙",available:true,price4h:2800,price8h:4800,price1d:8200,desc:"India's first internet car with a massive panoramic sunroof and 14-inch touchscreen, and hybrid efficiency."},
  {id:11,name:"Tata Nexon EV",brand:"Tata",model:"Nexon EV",year:2024,plate:"BA 11 JA 5566",type:"SUV",fuel:"Electric",transmission:"Automatic",seats:5,color:"Flame Red",emoji:"⚡",available:true,price4h:1900,price8h:3400,price1d:5800,desc:"A premium electric SUV with a 312km range. Zero emissions, full performance."},
  {id:12,name:"Ford Endeavour",brand:"Ford",model:"Endeavour",year:2022,plate:"BA 12 LA 7788",type:"SUV",fuel:"Diesel",transmission:"Automatic",seats:7,color:"Shadow Black",emoji:"🚙",available:false,price4h:3800,price8h:6500,price1d:11000,desc:"A rugged body-on-frame SUV built for adventure with terrain management system for any road."},
];

const fuelMeta = {
  Petrol:{icon:"⛽",cls:"fuel-petrol"},Diesel:{icon:"🛢️",cls:"fuel-diesel"},
  Electric:{icon:"⚡",cls:"fuel-electric"},Hybrid:{icon:"🔋",cls:"fuel-hybrid"},CNG:{icon:"🌿",cls:"fuel-cng"},
};
const galleryEmojis = ["🚗","🛣️","🏔️","🌆","🛤️"];
const id = parseInt(new URLSearchParams(window.location.search).get("id"))||1;
const v = VEHICLES.find(x=>x.id===id)||VEHICLES[0];
const fm = fuelMeta[v.fuel]||fuelMeta.Petrol;
document.getElementById("pageTitle").textContent = v.name;
document.title = `AUTO DEALER — ${v.name}`;

document.getElementById("mainContent").innerHTML = `
  <div class="breadcrumb">
    <a href="userdashboard.html">Dashboard</a>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    <a href="user.vehicle.listing.html">Vehicles</a>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    <span>${v.name}</span>
  </div>
  <div class="detail-layout">
    <div>
      <div class="detail-main-img" id="mainImg">
        <div style="font-size:100px">${v.emoji}</div>
        <span class="avail-overlay ${v.available?'av':'bk'}">${v.available?'✓ Available Now':'✗ Currently Booked'}</span>
      </div>
      <div class="gallery">
        ${galleryEmojis.map((e,i)=>`<div class="gallery-thumb ${i===0?'active':''}" onclick="selectThumb(this,'${e}')"><span style="font-size:22px">${e}</span></div>`).join('')}
      </div>
      <div class="detail-card">
        <div class="detail-card-title">Vehicle Specifications</div>
        <div class="specs-grid">
          <div class="spec-row"><span class="spec-key">Brand</span><span class="spec-val">${v.brand}</span></div>
          <div class="spec-row"><span class="spec-key">Model</span><span class="spec-val">${v.model}</span></div>
          <div class="spec-row"><span class="spec-key">Year</span><span class="spec-val">${v.year}</span></div>
          <div class="spec-row"><span class="spec-key">License Plate</span><span class="spec-val" style="font-family:'Space Mono',monospace;font-size:12px">${v.plate}</span></div>
          <div class="spec-row"><span class="spec-key">Body Type</span><span class="spec-val">${v.type}</span></div>
          <div class="spec-row"><span class="spec-key">Fuel Type</span><span class="spec-val ${fm.cls}">${fm.icon} ${v.fuel}</span></div>
          <div class="spec-row"><span class="spec-key">Transmission</span><span class="spec-val">${v.transmission}</span></div>
          <div class="spec-row"><span class="spec-key">Seating</span><span class="spec-val">${v.seats} Passengers</span></div>
          <div class="spec-row"><span class="spec-key">Color</span><span class="spec-val">${v.color}</span></div>
          <div class="spec-row"><span class="spec-key">Insurance</span><span class="spec-val" style="color:#16a34a">✓ Included</span></div>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">About This Vehicle</div>
        <p class="desc-text">${v.desc}</p>
      </div>
    </div>
    <div class="detail-sidebar">
      <div class="price-card">
        <div class="price-card-name">${v.name}</div>
        <div class="price-card-sub">${v.year} · ${v.type} · ${v.fuel}</div>
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px">Select Duration</div>
        <div class="pricing-options">
          <label class="pricing-opt selected" data-dur="4h" onclick="selectPricing('4h')">
            <span class="pricing-opt-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>4 Hours</span>
            <span class="pricing-opt-price">Rs.${v.price4h.toLocaleString()}</span>
          </label>
          <label class="pricing-opt" data-dur="8h" onclick="selectPricing('8h')">
            <span class="pricing-opt-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>8 Hours</span>
            <span class="pricing-opt-price">Rs.${v.price8h.toLocaleString()}</span>
          </label>
          <label class="pricing-opt" data-dur="1d" onclick="selectPricing('1d')">
            <span class="pricing-opt-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>1 Day</span>
            <span class="pricing-opt-price">Rs.${v.price1d.toLocaleString()}</span>
          </label>
        </div>
        <a href="user.booking.html?id=${v.id}" class="book-now-btn" ${v.available?'':'style="opacity:.5;pointer-events:none"'}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v5a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17h8M3 9h18"/></svg>
          ${v.available?'Book Now':'Currently Unavailable'}
        </a>
      </div>
      ${!v.available?`<div class="info-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>This vehicle is currently booked. Please check back later or browse other available vehicles.</div>`:''}
      <div class="detail-card" style="margin-bottom:0">
        <div class="detail-card-title">Includes</div>
        ${['Full insurance coverage','24/7 roadside assistance','Unlimited mileage','Clean & sanitized vehicle','GPS navigation'].map(f=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)">
            <span style="width:18px;height:18px;background:#ecfdf5;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#16a34a;font-weight:700">✓</span>${f}
          </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="footer-strip" style="margin-top:8px">
    <p>© 2026 Auto Dealer Fleet Management.</p>
    <div class="footer-links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></div>
  </div>
`;

function selectPricing(type) {
  document.querySelectorAll('.pricing-opt').forEach(el=>el.classList.remove('selected'));
  document.querySelector(`.pricing-opt[data-dur="${type}"]`).classList.add('selected');
}

function selectThumb(el, emoji) {
  document.querySelectorAll('.gallery-thumb').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const prev = document.getElementById("mainImg").querySelector('div');
  if(prev){ prev.style.transition='opacity .2s'; prev.style.opacity='0'; setTimeout(()=>{ prev.textContent=emoji; prev.style.opacity='1'; },150); }
}

// Sidebar & dropdown
const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("sidebarOverlay"),toggle=document.getElementById("sidebarToggle");
toggle?.addEventListener("click",()=>{sidebar.classList.toggle("open");overlay.classList.toggle("open");});
overlay?.addEventListener("click",()=>{sidebar.classList.remove("open");overlay.classList.remove("open");});
window.addEventListener("resize",()=>{if(toggle)toggle.style.display=window.innerWidth<=768?"flex":"none";});
if(toggle)toggle.style.display=window.innerWidth<=768?"flex":"none";
const trigger=document.getElementById("userMenuTrigger"),dropdown=document.getElementById("userDropdown"),chevron=document.getElementById("dropChevron");
let open=false;
trigger.addEventListener("click",e=>{e.stopPropagation();open=!open;dropdown.classList.toggle("open",open);chevron.style.transform=open?"rotate(180deg)":"";});
document.addEventListener("click",()=>{if(open){open=false;dropdown.classList.remove("open");chevron.style.transform="";}});
dropdown.addEventListener("click",e=>e.stopPropagation());
</script>
</body>
</html>
