<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRIVE - REGISTER</title>

    <link rel="stylesheet" href="register.css" />
  </head>

  <body>
    <div class="left-container">
      <div class="overlay-content">
        <span class="tag">PREMIUM FLEET</span>

        <h1>Create your account</h1>

        <p class="subtitle">Fast. Easy. Reliable.</p>

        <div class="brand">
          <span class="line"></span>
          <p>AUTO DEALER</p>
        </div>
      </div>
    </div>

    <div class="right-container">
      <!-- MESSAGE -->
      <div class="message">
        <h1>CREATE ACCOUNT</h1>
        <p>Please fill in the details to get started</p>
      </div>

      <!-- FORM CONTAINER -->
      <div class="form-container">
        <form id="register-form">
          <!-- FULL NAME -->
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          />

          <!-- EMAIL -->
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <!-- PHONE NUMBER -->
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          />

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrap">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />

              <button type="button" id="togglePassword" class="eye-btn">
                <svg viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>

            <div class="password-wrap">
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                required
              />

              <button type="button" id="toggleConfirmPassword" class="eye-btn">
                <svg viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- REGISTER BUTTON -->
          <button type="submit" class="login-btn">Register</button>

          <!-- LOGIN LINK -->
          <p>
            Already have an account?
            <a href="index.html"> Login</a>
          </p>
        </form>
      </div>

      <!-- MESSAGE DIV -->
      <div id="register-message"></div>
    </div>

    <script src="register.js"></script>
  </body>
</html>
