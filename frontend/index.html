<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIVE - LOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-container">
    <div class="overlay-content">
        <span class="tag">PREMIUM FLEET</span>

        <h1>Rent your perfect ride</h1>

        <p class="subtitle">Fast. Easy. Reliable.</p>

        <div class="brand">
            <span class="line"></span>
            <p>AUTO DEALER</p>
        </div>
    </div>
</div>

    <div class="right-container">

        <!-- MESSAGE -->
        <div class="message">
            <h1>WELCOME BACK</h1>
            <p>Please enter your details to access your account</p>
        </div>

        <!-- FORM CONTAINER -->
        <div class="form-container">
            <form id="login-form">
                <!-- EMAIL -->
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <!-- PASSWORD -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" class="forgot">Forgot password?</a>
                    </div>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-btn">Login</button>

                <!-- GOOGLE LOGIN BUTTON -->
                <button type="button" class="google-btn">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
                        alt="Google Logo">
                    <span>Sign in with Google</span>
                </button>

                <!-- SIGN UP -->
                <p>Don't have an account?<a href="register.html"> Sign Up</a></p>
            </form>
        </div>

        <!-- MESSAGE DIV OUTSIDE FORM CONTAINER -->
        <div id="login-message"></div>

        <script src="script.js"></script>
</body>

</html>
